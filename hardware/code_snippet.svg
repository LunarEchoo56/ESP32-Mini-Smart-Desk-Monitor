<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320">
  <rect width="100%" height="100%" rx="10" fill="#282a36"/>
  <rect x="0" y="0" width="100%" height="30" rx="10" fill="#44475a"/>
  <!-- MacOS style window buttons -->
  <circle cx="20" cy="15" r="6" fill="#ff5555"/>
  <circle cx="40" cy="15" r="6" fill="#f1fa8c"/>
  <circle cx="60" cy="15" r="6" fill="#50fa7b"/>
  <text x="300" y="20" font-family="monospace" font-size="12" fill="#f8f8f2" text-anchor="middle">esp32_smart_desk_monitor.ino</text>
  
  <text x="20" y="65" font-family="monospace" font-size="14" fill="#ff79c6">void</text>
  <text x="60" y="65" font-family="monospace" font-size="14" fill="#50fa7b">setup</text>
  <text x="100" y="65" font-family="monospace" font-size="14" fill="#f8f8f2">() {</text>
  
  <text x="40" y="95" font-family="monospace" font-size="14" fill="#6272a4">// Initialize serial communication</text>
  <text x="40" y="120" font-family="monospace" font-size="14" fill="#8be9fd">Serial</text>
  <text x="90" y="120" font-family="monospace" font-size="14" fill="#f8f8f2">.</text>
  <text x="100" y="120" font-family="monospace" font-size="14" fill="#50fa7b">begin</text>
  <text x="140" y="120" font-family="monospace" font-size="14" fill="#f8f8f2">(115200);</text>
  
  <text x="40" y="155" font-family="monospace" font-size="14" fill="#6272a4">// Initialize the DHT sensor</text>
  <text x="40" y="180" font-family="monospace" font-size="14" fill="#f8f8f2">dht.</text>
  <text x="75" y="180" font-family="monospace" font-size="14" fill="#50fa7b">begin</text>
  <text x="115" y="180" font-family="monospace" font-size="14" fill="#f8f8f2">();</text>
  
  <text x="40" y="215" font-family="monospace" font-size="14" fill="#6272a4">// Initialize OLED display</text>
  <text x="40" y="240" font-family="monospace" font-size="14" fill="#ff79c6">if</text>
  <text x="60" y="240" font-family="monospace" font-size="14" fill="#f8f8f2">(!display.</text>
  <text x="135" y="240" font-family="monospace" font-size="14" fill="#50fa7b">begin</text>
  <text x="175" y="240" font-family="monospace" font-size="14" fill="#f8f8f2">(SSD1306_SWITCHCAPVCC, 0x3C)) {</text>
  
  <text x="60" y="265" font-family="monospace" font-size="14" fill="#8be9fd">Serial</text>
  <text x="110" y="265" font-family="monospace" font-size="14" fill="#f8f8f2">.</text>
  <text x="120" y="265" font-family="monospace" font-size="14" fill="#50fa7b">println</text>
  <text x="175" y="265" font-family="monospace" font-size="14" fill="#f8f8f2">(F(</text>
  <text x="195" y="265" font-family="monospace" font-size="14" fill="#f1fa8c">"SSD1306 allocation failed"</text>
  <text x="390" y="265" font-family="monospace" font-size="14" fill="#f8f8f2">));</text>
  
  <text x="20" y="295" font-family="monospace" font-size="14" fill="#f8f8f2">}</text>
</svg>
