<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300">
  <rect width="100%" height="100%" rx="10" fill="#282a36"/>
  <rect x="0" y="0" width="100%" height="40" rx="10" fill="#44475a"/>
  <text x="20" y="26" font-family="monospace" font-weight="bold" font-size="16" fill="#f8f8f2">ESP32 Desk Monitor - Bill of Materials</text>
  
  <text x="20" y="80" font-family="monospace" font-size="15" fill="#8be9fd">- ESP32 Development Board (USB-C or Micro-USB)</text>
  <text x="20" y="115" font-family="monospace" font-size="15" fill="#8be9fd">- 1.3" I2C OLED Display (SH1106 / SSD1306)</text>
  <text x="20" y="150" font-family="monospace" font-size="15" fill="#8be9fd">- DHT22 Temperature &amp; Humidity Sensor</text>
  <text x="20" y="185" font-family="monospace" font-size="15" fill="#8be9fd">- 10k Ohm Resistor (pull-up for DHT22)</text>
  <text x="20" y="220" font-family="monospace" font-size="15" fill="#8be9fd">- Custom Bent Sheet Metal Frame / Standoffs</text>
  <text x="20" y="255" font-family="monospace" font-size="15" fill="#8be9fd">- Connecting wires (female-to-female DuPont)</text>
</svg>
